name: CLI Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-entry-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Smoke every installed command
        run: |
          defeat-watermarker --help
          defeat-watermarker-attack --help
          defeat-watermarker-ui --help
          defeat-watermarker-scan-verify --help
          defeat-watermarker-batch --help
          defeat-watermarker-batch-verify --help
          defeat-watermarker-benchmark-verify --help
          defeat-watermarker-report --help
