name: Benchmark CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provider-detector-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]' -e fixtures/plugins/example_text_detector
      - name: Run labelled reliability benchmark through explicit plugin
        run: >-
          defeat-watermarker benchmark reliability
          fixtures/benchmarks/text-detectors/reliability-v0.1.json
          --detector-plugin fixture-text
          --output /tmp/reliability.json
      - name: Run pairwise interoperability benchmark through explicit plugins
        run: >-
          defeat-watermarker benchmark interoperability
          fixtures/benchmarks/text-detectors/interoperability-v0.1.json
          --detector-plugin fixture-text
          --detector-plugin fixture-text-secondary
          --output /tmp/interoperability.json
      - name: Assert labelled metrics and runtime bindings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from defeat_watermarker.digests import content_digest

          reliability = json.loads(Path('/tmp/reliability.json').read_text(encoding='utf-8'))
          interoperability = json.loads(Path('/tmp/interoperability.json').read_text(encoding='utf-8'))

          assert reliability['schema_version'] == '0.2'
          assert reliability['summary']['true_positive'] == 1
          assert reliability['summary']['true_negative'] == 1
          assert reliability['summary']['false_positive'] == 0
          assert reliability['summary']['false_negative'] == 0
          assert reliability['summary']['accuracy'] == 1.0
          assert any(
              item == 'plugin-distribution=defeat-watermarker-fixture-text-detector==0.2.0'
              for item in reliability['adapter_runtime']
          )
          reliability_id = reliability.pop('report_id')
          assert content_digest(reliability) == reliability_id

          assert interoperability['schema_version'] == '0.2'
          pair = interoperability['pairs'][0]
          assert pair['comparable_cases'] == 3
          assert pair['detection_agreements'] == 2
          assert pair['detection_disagreements'] == 1
          assert abs(pair['agreement_rate'] - (2 / 3)) < 1e-12
          for adapter_id in ('fixture.text-marker.v1', 'fixture.text-secondary.v1'):
              assert any(
                  item == 'plugin-distribution=defeat-watermarker-fixture-text-detector==0.2.0'
                  for item in interoperability['adapter_runtime'][adapter_id]
              )
          interoperability_id = interoperability.pop('report_id')
          assert content_digest(interoperability) == interoperability_id
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-detector-benchmark-evidence
          path: |
            /tmp/reliability.json
            /tmp/interoperability.json
          if-no-files-found: error
          retention-days: 14
