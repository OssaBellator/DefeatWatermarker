name: Batch CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  permanent-fixture-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run detector-only fixture batch
        run: >-
          defeat-watermarker-batch fixtures/retests
          --scan-only
          --output-dir /tmp/defeat-watermarker-batch
      - name: Verify every scan record offline
        run: |
          set -euo pipefail
          for record in /tmp/defeat-watermarker-batch/records/*.json; do
            defeat-watermarker-scan-verify "$record"
          done
      - name: Assert batch index integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from defeat_watermarker.digests import content_digest

          path = Path('/tmp/defeat-watermarker-batch/batch.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          batch_id = payload.pop('batch_id')
          assert content_digest(payload) == batch_id
          assert len(payload['records']) == 3  # README + text + image fixture
          assert all(item['mode'] == 'scan' for item in payload['records'])
          assert all(item['record_id'] for item in payload['records'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: permanent-batch-evidence
          path: /tmp/defeat-watermarker-batch
          if-no-files-found: error
          retention-days: 14
