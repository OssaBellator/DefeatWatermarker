name: Batch CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  permanent-fixture-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]' -e fixtures/plugins/example_text_detector
      - name: Run detector-only fixture batch
        run: >-
          defeat-watermarker-batch fixtures/retests
          --scan-only
          --output-dir /tmp/defeat-watermarker-scan-batch
      - name: Verify detector-only batch offline
        run: defeat-watermarker-batch-verify /tmp/defeat-watermarker-scan-batch
      - name: Run mixed fixed-attack fixture batch
        run: >-
          defeat-watermarker-batch fixtures/retests
          --detector-plugin fixture-text
          --output-dir /tmp/defeat-watermarker-attack-batch
      - name: Verify mixed attack/scan batch offline
        run: defeat-watermarker-batch-verify /tmp/defeat-watermarker-attack-batch
      - name: Assert mixed-modality batch shapes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          scan = json.loads(
              Path('/tmp/defeat-watermarker-scan-batch/batch.json').read_text(encoding='utf-8')
          )
          attack = json.loads(
              Path('/tmp/defeat-watermarker-attack-batch/batch.json').read_text(encoding='utf-8')
          )
          assert len(scan['records']) == 3  # README + text + image fixture
          assert all(item['mode'] == 'scan' for item in scan['records'])
          assert all(item['record_id'] for item in scan['records'])

          modes = {item['relative_path']: item['mode'] for item in attack['records']}
          assert modes['README.md'] == 'scan'
          assert modes['example_image.ppm'] == 'attack'
          assert modes['example_text.txt'] == 'attack'
          assert all(item['record_id'] for item in attack['records'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: permanent-batch-evidence
          path: |
            /tmp/defeat-watermarker-scan-batch
            /tmp/defeat-watermarker-attack-batch
          if-no-files-found: error
          retention-days: 14
