name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  resolved-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Resolve dependency graph at fixed release horizon
        run: uv lock --all-extras
      - name: Assert lockfile is self-consistent
        run: uv lock --check
      - name: Export CycloneDX dependency inventory
        run: |
          mkdir -p supply-chain
          uv export --locked --all-extras --format cyclonedx1.5 \
            --output-file supply-chain/defeat-watermarker.cdx.json
          cp uv.lock supply-chain/uv.lock
      - name: Validate SBOM envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('supply-chain/defeat-watermarker.cdx.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['bomFormat'] == 'CycloneDX'
          assert payload['specVersion'] == '1.5'
          assert isinstance(payload.get('components'), list)
          assert path.stat().st_size < 8 * 1024 * 1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-supply-chain
          path: |
            supply-chain/uv.lock
            supply-chain/defeat-watermarker.cdx.json
          if-no-files-found: error
          retention-days: 14
