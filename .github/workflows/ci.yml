name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Smoke installed anti-watermark CLIs
        run: |
          defeat-watermarker-attack --help
          defeat-watermarker-ui --help
          defeat-watermarker-ui --list-builtins

  fixture-retests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run generated text artifact through console UI
        run: |
          mkdir -p retest-output
          defeat-watermarker-ui fixtures/retests/example_text.txt \
            --media-type text/plain \
            --json-output retest-output/text-evidence.json
      - name: Run generated image artifact through console UI
        run: |
          defeat-watermarker-ui fixtures/retests/example_image.ppm \
            --media-type image/x-portable-pixmap \
            --json-output retest-output/image-evidence.json
      - name: Verify emitted evidence offline
        run: |
          defeat-watermarker evidence verify retest-output/text-evidence.json
          defeat-watermarker evidence verify retest-output/image-evidence.json
      - name: Assert fixture regression expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          text = json.loads(Path('retest-output/text-evidence.json').read_text())
          image = json.loads(Path('retest-output/image-evidence.json').read_text())
          adapter_id = 'builtin.container-hints.v1'

          assert text['suite']['suite_id'] == 'text-editorial-normalization'
          assert len(text['report']['scenarios']) == 3

          baseline = {item['adapter_id']: item for item in image['report']['baseline']}
          assert baseline[adapter_id]['detected'] is True
          comparisons = [
              comparison
              for scenario in image['report']['scenarios']
              for comparison in scenario['comparisons']
              if comparison['adapter_id'] == adapter_id
          ]
          assert comparisons
          assert all(not item['after']['detected'] for item in comparisons)
          assert image['summary']['survival_rate'] == 0.0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: permanent-retest-evidence
          path: retest-output/*.json
          if-no-files-found: error
          retention-days: 14

  c2pa-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[c2pa]'
      - name: Verify official SDK is discoverable
        run: >-
          python -c "from defeat_watermarker.adapters.c2pa import C2paPythonBackend;
          assert C2paPythonBackend.available()"

  video-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Create bounded synthetic video fixture
        run: >-
          ffmpeg -hide_banner -loglevel error -f lavfi
          -i testsrc=size=64x64:rate=2 -t 1
          -c:v libx264 -pix_fmt yuv420p /tmp/source.mp4
      - name: Run fixed anti-watermark video attack suite
        run: >-
          defeat-watermarker-attack /tmp/source.mp4
          --media-type video/mp4
          --suite suites/video-platform-v0.1.json
          --output /tmp/video-evidence.json
      - name: Verify video evidence bindings offline
        run: >-
          python -m defeat_watermarker evidence verify /tmp/video-evidence.json
          --suite suites/video-platform-v0.1.json
