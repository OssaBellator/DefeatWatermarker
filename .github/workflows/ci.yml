name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Smoke installed anti-watermark CLIs
        run: |
          defeat-watermarker-attack --help
          defeat-watermarker-ui --help
          defeat-watermarker-ui --list-builtins

  fixture-retests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run generated text artifact through console UI
        run: |
          mkdir -p retest-output
          defeat-watermarker-ui fixtures/retests/example_text.txt \
            --media-type text/plain \
            --json-output retest-output/text-evidence.json
      - name: Run generated image artifact through console UI
        run: |
          defeat-watermarker-ui fixtures/retests/example_image.ppm \
            --media-type image/x-portable-pixmap \
            --json-output retest-output/image-evidence.json
      - name: Verify emitted evidence offline
        run: |
          defeat-watermarker evidence verify retest-output/text-evidence.json
          defeat-watermarker evidence verify retest-output/image-evidence.json
      - name: Assert fixture regression expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          text = json.loads(Path('retest-output/text-evidence.json').read_text())
          image = json.loads(Path('retest-output/image-evidence.json').read_text())
          adapter_id = 'builtin.container-hints.v1'

          assert text['suite']['suite_id'] == 'text-editorial-normalization'
          assert len(text['report']['scenarios']) == 3

          baseline = {item['adapter_id']: item for item in image['report']['baseline']}
          assert baseline[adapter_id]['detected'] is True
          comparisons = [
              comparison
              for scenario in image['report']['scenarios']
              for comparison in scenario['comparisons']
              if comparison['adapter_id'] == adapter_id
          ]
          assert comparisons
          assert all(not item['after']['detected'] for item in comparisons)
          assert image['summary']['survival_rate'] == 0.0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: permanent-retest-evidence
          path: retest-output/*.json
          if-no-files-found: error
          retention-days: 14

  c2pa-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[c2pa,image]'
      - name: Verify official SDK is discoverable
        run: >-
          python -c "from defeat_watermarker.adapters.c2pa import C2paPythonBackend;
          assert C2paPythonBackend.available()"
      - name: Generate ephemeral C2PA fixture credentials
        run: |
          set -euo pipefail
          mkdir -p /tmp/c2pa-fixture
          openssl ecparam -name prime256v1 -genkey -noout \
            -out /tmp/c2pa-fixture/root.key
          openssl req -new -x509 -sha256 -days 3650 \
            -key /tmp/c2pa-fixture/root.key \
            -subj '/O=DefeatWatermarker Test Fixtures/CN=Ephemeral C2PA Root' \
            -config fixtures/c2pa/openssl-fixture.cnf \
            -extensions root_ext \
            -out /tmp/c2pa-fixture/root.pem
          openssl ecparam -name prime256v1 -genkey -noout \
            -out /tmp/c2pa-fixture/leaf.key
          openssl req -new -sha256 \
            -key /tmp/c2pa-fixture/leaf.key \
            -subj '/O=DefeatWatermarker Test Fixtures/CN=Ephemeral C2PA Signer' \
            -out /tmp/c2pa-fixture/leaf.csr
          openssl x509 -req -sha256 -days 365 \
            -in /tmp/c2pa-fixture/leaf.csr \
            -CA /tmp/c2pa-fixture/root.pem \
            -CAkey /tmp/c2pa-fixture/root.key \
            -CAcreateserial \
            -extfile fixtures/c2pa/openssl-fixture.cnf \
            -extensions leaf_ext \
            -out /tmp/c2pa-fixture/leaf.pem
          cat /tmp/c2pa-fixture/leaf.pem /tmp/c2pa-fixture/root.pem \
            > /tmp/c2pa-fixture/chain.pem
      - name: Generate signed and tampered C2PA fixtures
        run: |
          python scripts/generate_c2pa_retest_fixture.py \
            --source fixtures/retests/example_image.ppm \
            --chain /tmp/c2pa-fixture/chain.pem \
            --private-key /tmp/c2pa-fixture/leaf.key \
            --jpeg-source /tmp/c2pa-fixture/source.jpg \
            --signed /tmp/c2pa-fixture/signed.jpg \
            --tampered /tmp/c2pa-fixture/tampered.jpg \
            --metadata /tmp/c2pa-fixture/generation.json
      - name: Run signed fixture through anti-watermark console
        run: |
          defeat-watermarker-ui /tmp/c2pa-fixture/signed.jpg \
            --media-type image/jpeg \
            --c2pa-trust-anchors /tmp/c2pa-fixture/root.pem \
            --json-output /tmp/c2pa-fixture/signed-evidence.json
          defeat-watermarker evidence verify /tmp/c2pa-fixture/signed-evidence.json
      - name: Inspect tampered fixture
        run: |
          defeat-watermarker scan /tmp/c2pa-fixture/tampered.jpg \
            --media-type image/jpeg \
            --c2pa-trust-anchors /tmp/c2pa-fixture/root.pem \
            --output /tmp/c2pa-fixture/tampered-scan.json
      - name: Assert C2PA cryptographic regression states
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          signed = json.loads(Path('/tmp/c2pa-fixture/signed-evidence.json').read_text())
          tampered = json.loads(Path('/tmp/c2pa-fixture/tampered-scan.json').read_text())
          adapter_id = 'c2pa.reader.v1'

          signed_baseline = {
              item['adapter_id']: item for item in signed['report']['baseline']
          }[adapter_id]
          assert signed_baseline['detected'] is True
          assert signed_baseline['cryptographically_verified'] is True
          assert signed_baseline['verification_state'] in {'valid', 'trusted'}

          tampered_result = {
              item['adapter_id']: item for item in tampered['results']
          }[adapter_id]
          assert tampered_result['detected'] is True
          assert tampered_result['cryptographically_verified'] is False
          assert tampered_result['verification_state'] == 'invalid'
          PY
      - name: Preserve C2PA regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: c2pa-regression-evidence
          path: |
            /tmp/c2pa-fixture/generation.json
            /tmp/c2pa-fixture/signed-evidence.json
            /tmp/c2pa-fixture/tampered-scan.json
            /tmp/c2pa-fixture/root.pem
          if-no-files-found: error
          retention-days: 14

  video-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Create bounded synthetic video fixture
        run: >-
          ffmpeg -hide_banner -loglevel error -f lavfi
          -i testsrc=size=64x64:rate=2 -t 1
          -c:v libx264 -pix_fmt yuv420p /tmp/source.mp4
      - name: Run fixed anti-watermark video attack suite
        run: >-
          defeat-watermarker-attack /tmp/source.mp4
          --media-type video/mp4
          --suite suites/video-platform-v0.1.json
          --output /tmp/video-evidence.json
      - name: Verify video evidence bindings offline
        run: >-
          python -m defeat_watermarker evidence verify /tmp/video-evidence.json
          --suite suites/video-platform-v0.1.json
