[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defeat-watermarker-fixture-text-detector"
version = "0.1.0"
description = "Synthetic text detector plugin used only for DefeatWatermarker regression tests"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."defeat_watermarker.detectors"]
fixture-text = "fixture_text_detector:FixtureTextDetector"

[tool.setuptools]
py-modules = ["fixture_text_detector"]
