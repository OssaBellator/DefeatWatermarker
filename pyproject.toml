[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defeat-watermarker"
version = "0.1.0"
description = "Defensive watermark and provenance robustness evaluation framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DefeatWatermarker contributors"}]
dependencies = []

[project.optional-dependencies]
c2pa = ["c2pa-python>=0.33,<1"]
dev = ["pytest>=8,<9"]

[project.scripts]
defeat-watermarker = "defeat_watermarker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
